<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.CSS">
    <link rel="icon" href="image/flower-5.jpeg">

    <title>shoppingcart || register</title>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="brand">SHOPPING</a>
                <nav>
                    <ul id="links">
                        <li><a href="login.html">SIGN IN</a></li>
                        <li><a href="register.html">SIGN UP</a></li>
                    </ul>
                    <ul id="user-info">
                        <li><a href="#" id="user"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <section class="section-form">
        <h2>REGISTER BADGE</h2>
        <form>
            <input type="text" placeholder="enter your name" id="username">
            <input type="email" placeholder="enter your email" id="email">
            <div class="box">
            <input type="password" placeholder="enter your password" id="password">
            <input type="checkbox" id="show">
            <label for="show" class="eye1"><i class="fa-solid fa-eye"></i></label>
            <label for="show" class="eye2"><i class="fa-solid fa-eye-slash"></i></label>
            </div>
            <input type="submit" id="sign-up">
        </form>
    </section>
    <script src="script/user.js"></script>
    <script src="script/register.js"></script>
</body>
